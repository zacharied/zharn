[project]
name = "my-harness"
version = "0.0.1"
description = "A native, self-modifying coding-agent harness (Qt / PySide6 + QML). Your fork is your config."
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["PySide6-Essentials>=6.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness = "harness.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
